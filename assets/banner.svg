<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="280" fill="none" viewBox="0 0 1200 280"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0b1e"/><stop offset="50%" stop-color="#111836"/><stop offset="100%" stop-color="#080914"/></linearGradient><linearGradient id="accent-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="50%" stop-color="#ec4899"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><linearGradient id="badge-glow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#6366f1" stop-opacity=".4"/><stop offset="100%" stop-color="#a855f7" stop-opacity=".1"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="25"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseOrb{0%{transform:scale(1) translate(0,0);opacity:.45}50%{transform:scale(1.15) translate(25px,-15px);opacity:.75}}@keyframes floatCard1{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes floatCard2{0%{transform:translateY(0)}50%{transform:translateY(8px)}}.orb-1{animation:pulseOrb 8s ease-in-out infinite;transform-origin:200px 100px}.orb-2{animation:pulseOrb 10s ease-in-out infinite alternate;transform-origin:1000px 180px}.card-float-1{animation:floatCard1 5s ease-in-out infinite}.card-float-2{animation:floatCard2 6s ease-in-out infinite}.title-text{font-weight:800}.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}</style><rect width="1200" height="280" fill="url(#bg-grad)" rx="16"/><circle cx="220" cy="90" r="130" fill="#7c3aed" class="orb-1" filter="url(#glow)"/><circle cx="980" cy="180" r="150" fill="#ec4899" class="orb-2" filter="url(#glow)"/><circle cx="600" cy="240" r="100" fill="#2563eb" filter="url(#glow)" opacity=".25"/><g stroke="#94a3b8" stroke-width="1" opacity=".12"><path d="M0 40 H1200 M0 100 H1200 M0 160 H1200 M0 220 H1200"/><path d="M150 0 V280 M300 0 V280 M450 0 V280 M600 0 V280 M750 0 V280 M900 0 V280 M1050 0 V280"/></g><g class="card-float-1" transform="translate(50, 45)"><rect width="160" height="44" fill="url(#badge-glow)" stroke="#8b5cf6" stroke-opacity=".4" stroke-width="1" rx="22"/><circle cx="24" cy="22" r="7" fill="#a855f7"/><text x="38" y="27" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">✨ AI Inpainting</text></g><g class="card-float-2" transform="translate(40, 190)"><rect width="170" height="44" fill="url(#badge-glow)" stroke="#ec4899" stroke-opacity=".4" stroke-width="1" rx="22"/><circle cx="24" cy="22" r="7" fill="#ec4899"/><text x="38" y="27" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">⚡ BiRefNet Cutout</text></g><g class="card-float-2" transform="translate(980, 45)"><rect width="180" height="44" fill="url(#badge-glow)" stroke="#3b82f6" stroke-opacity=".4" stroke-width="1" rx="22"/><circle cx="24" cy="22" r="7" fill="#3b82f6"/><text x="38" y="27" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">🎨 Creative Relight</text></g><g class="card-float-1" transform="translate(990, 190)"><rect width="165" height="44" fill="url(#badge-glow)" stroke="#10b981" stroke-opacity=".4" stroke-width="1" rx="22"/><circle cx="24" cy="22" r="7" fill="#10b981"/><text x="38" y="27" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">🔍 Ultra Super-Res</text></g><g id="foreground-header"><text x="600" y="105" fill="url(#accent-grad)" class="title-text" font-size="40" letter-spacing="-.5" text-anchor="middle">AI Image Editing &amp; Creative Retouching</text><text x="600" y="148" fill="#f8fafc" class="subtitle-text" font-size="17" font-weight="600" letter-spacing=".2" text-anchor="middle">Curated Landscape of Commercial SaaS Leaders &amp; Open-Source Deep Learning Models</text><text x="600" y="182" fill="#94a3b8" class="subtitle-text" font-size="13" font-weight="500" text-anchor="middle">Inpainting • Generative Fill • Relighting • Matting • Super-Resolution Upscaling • RAW Photo Workflows</text><g transform="translate(515, 208)"><rect width="170" height="28" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" rx="14"/><circle cx="14" cy="14" r="4.5" fill="#22c55e"><animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="1;0.3;1"/></circle><text x="26" y="18.5" fill="#c7d2fe" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing=".5">NOVEMBER 2026 EDITION</text></g></g></svg>