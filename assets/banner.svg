<svg width="100%" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b1e" />
      <stop offset="50%" stop-color="#111836" />
      <stop offset="100%" stop-color="#080914" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="badge-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.45; }
      50% { transform: scale(1.15) translate(25px, -15px); opacity: 0.75; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite alternate; transform-origin: 1000px 180px; }
    .card-float-1 { animation: floatCard1 5s ease-in-out infinite; }
    .card-float-2 { animation: floatCard2 6s ease-in-out infinite; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="280" rx="16" fill="url(#bg-grad)" />

  <!-- Animated Glowing Background Orbs (Kept behind all text) -->
  <circle class="orb-1" cx="220" cy="90" r="130" fill="#7c3aed" filter="url(#glow)" />
  <circle class="orb-2" cx="980" cy="180" r="150" fill="#ec4899" filter="url(#glow)" />
  <circle cx="600" cy="240" r="100" fill="#2563eb" opacity="0.25" filter="url(#glow)" />

  <!-- Background Subtle Grid -->
  <g opacity="0.12" stroke="#94a3b8" stroke-width="1">
    <path d="M0 40 H1200 M0 100 H1200 M0 160 H1200 M0 220 H1200" />
    <path d="M150 0 V280 M300 0 V280 M450 0 V280 M600 0 V280 M750 0 V280 M900 0 V280 M1050 0 V280" />
  </g>

  <!-- Left Floating Interactive Pill (Decorative Element) -->
  <g class="card-float-1" transform="translate(50, 45)">
    <rect width="160" height="44" rx="22" fill="url(#badge-glow)" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="24" cy="22" r="7" fill="#a855f7" />
    <text x="38" y="27" fill="#e2e8f0" font-size="12" font-family="sans-serif" font-weight="600">✨ AI Inpainting</text>
  </g>

  <!-- Left Secondary Pill -->
  <g class="card-float-2" transform="translate(40, 190)">
    <rect width="170" height="44" rx="22" fill="url(#badge-glow)" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="24" cy="22" r="7" fill="#ec4899" />
    <text x="38" y="27" fill="#e2e8f0" font-size="12" font-family="sans-serif" font-weight="600">⚡ BiRefNet Cutout</text>
  </g>

  <!-- Right Floating Interactive Pill -->
  <g class="card-float-2" transform="translate(980, 45)">
    <rect width="180" height="44" rx="22" fill="url(#badge-glow)" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="24" cy="22" r="7" fill="#3b82f6" />
    <text x="38" y="27" fill="#e2e8f0" font-size="12" font-family="sans-serif" font-weight="600">🎨 Creative Relight</text>
  </g>

  <!-- Right Secondary Pill -->
  <g class="card-float-1" transform="translate(990, 190)">
    <rect width="165" height="44" rx="22" fill="url(#badge-glow)" stroke="#10b981" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="24" cy="22" r="7" fill="#10b981" />
    <text x="38" y="27" fill="#e2e8f0" font-size="12" font-family="sans-serif" font-weight="600">🔍 Ultra Super-Res</text>
  </g>

  <!-- Center Foreground Content: High Contrast & Unobscured -->
  <g id="foreground-header">
    <text class="title-text" x="600" y="105" text-anchor="middle" font-size="40" fill="url(#accent-grad)" letter-spacing="-0.5">
      AI Image Editing &amp; Creative Retouching
    </text>

    <text class="subtitle-text" x="600" y="148" text-anchor="middle" font-size="17" fill="#f8fafc" font-weight="600" letter-spacing="0.2">
      Curated Landscape of Commercial SaaS Leaders &amp; Open-Source Deep Learning Models
    </text>

    <text class="subtitle-text" x="600" y="182" text-anchor="middle" font-size="13" fill="#94a3b8" font-weight="500">
      Inpainting • Generative Fill • Relighting • Matting • Super-Resolution Upscaling • RAW Photo Workflows
    </text>

    <g transform="translate(515, 208)">
      <rect width="170" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
      <circle cx="14" cy="14" r="4.5" fill="#22c55e">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="26" y="18.5" fill="#c7d2fe" font-size="11" font-family="sans-serif" font-weight="700" letter-spacing="0.5">NOVEMBER 2026 EDITION</text>
    </g>
  </g>
</svg>